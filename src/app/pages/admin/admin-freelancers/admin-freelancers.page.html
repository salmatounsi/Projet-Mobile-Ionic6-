<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Freelancers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="body">

    <!-- Segment filtre -->
    <ion-segment [(ngModel)]="filter" (ionChange)="applyFilter()" class="admin-segment">
      <ion-segment-button value="pending">
        <ion-label>En attente</ion-label>
      </ion-segment-button>
      <ion-segment-button value="approved">
        <ion-label>Validés</ion-label>
      </ion-segment-button>
      <ion-segment-button value="rejected">
        <ion-label>Refusés</ion-label>
      </ion-segment-button>
      <ion-segment-button value="all">
        <ion-label>Tous</ion-label>
      </ion-segment-button>
    </ion-segment>

    <!-- Loading -->
    <div class="empty-state" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- Liste -->
    <div class="freelancers-list" *ngIf="!loading">

      <div class="empty-state"
        *ngIf="filtered.length === 0">
        <ion-icon name="people-outline" class="empty-icon"></ion-icon>
        <p class="empty-text">Aucun freelancer dans cette catégorie.</p>
      </div>

      <div class="freelancer-card"
        *ngFor="let f of filtered"
        (click)="openDetail(f)">

        <div class="card-left">
          <div class="avatar">
            <img *ngIf="f.profile_image" [src]="f.profile_image" alt=""/>
            <span *ngIf="!f.profile_image">{{ initials(f.first_name, f.last_name) }}</span>
          </div>
          <div class="info">
            <p class="name">{{ f.first_name }} {{ f.last_name }}</p>
            <p class="role">{{ f.professional_role || 'Rôle non défini' }}</p>
            <p class="country">
              <ion-icon name="location-outline"></ion-icon>
              {{ f.country }}
            </p>
          </div>
        </div>

        <div class="card-right">
          <span class="status-badge" [ngClass]="f.profile_status || 'pending'">
            {{ statusLabel(f.profile_status) }}
          </span>
          <ion-icon name="chevron-forward-outline" class="arrow"></ion-icon>
        </div>

      </div>
    </div>

  </div>
</ion-content>
